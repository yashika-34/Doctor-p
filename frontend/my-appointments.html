<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Appointments | DoctorP</title>
  <meta name="description" content="View and track your scheduled healthcare appointments and consultation history.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230d9488'><path d='M19 10.5h-5.5V5c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v5.5H5c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5h5.5V19c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5v-5.5H19c.83 0 1.5-.67 1.5-1.5s-.67-1.5-1.5-1.5z'/></svg>">
</head>
<body>

  <!-- Dynamic Header Navbar -->
  <header id="main-header"></header>

  <main style="padding: 3rem 0 5rem;">
    <div class="container">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
        <div>
          <h1 style="font-size: 2.25rem; color: var(--navy-dark); margin-bottom: 0.35rem;">My Appointments</h1>
          <p style="color: var(--navy-muted);">Real-time status of your upcoming and past doctor consultations.</p>
        </div>
        <a href="doctors.html" class="btn btn-primary">Book Another Appointment +</a>
      </div>

      <!-- Quick Metrics -->
      <div class="metric-cards-grid" style="margin-bottom: 2.5rem;">
        <div class="metric-card">
          <div class="metric-icon-box" style="background: #e0f2fe; color: #0284c7;">📅</div>
          <div class="metric-info">
            <h3 id="stat-upcoming">0</h3>
            <p>Upcoming Visits</p>
          </div>
        </div>

        <div class="metric-card">
          <div class="metric-icon-box" style="background: #d1fae5; color: #059669;">✓</div>
          <div class="metric-info">
            <h3 id="stat-completed">0</h3>
            <p>Completed Visits</p>
          </div>
        </div>

        <div class="metric-card">
          <div class="metric-icon-box">📊</div>
          <div class="metric-info">
            <h3 id="stat-total">0</h3>
            <p>Total Bookings</p>
          </div>
        </div>
      </div>

      <!-- Appointments List Table -->
      <div class="table-responsive">
        <table class="custom-table">
          <thead>
            <tr>
              <th>Booking ID</th>
              <th>Doctor & Specialty</th>
              <th>Schedule</th>
              <th>Fee</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="patient-appointments-table-body">
            <!-- Loaded dynamically via patient-dashboard.js -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- SMART REVIEW MODAL (Feature 4) -->
  <div class="modal-overlay" id="review-modal">
    <div class="modal-content">
      <button class="modal-close-btn" id="btn-close-review-modal">✕</button>

      <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.25rem;">
        <div style="width: 44px; height: 44px; border-radius: 50%; background: #fef3c7; color: #d97706; display: flex; align-items: center; justify-content: center; font-size: 1.5rem;">
          ⭐
        </div>
        <div>
          <h3 style="font-size: 1.25rem; color: var(--navy-dark); margin: 0;">Review Your Visit</h3>
          <p style="font-size: 0.85rem; color: var(--navy-muted); margin: 0;">With <strong id="review-doc-name">Doctor</strong></p>
        </div>
      </div>

      <form id="review-form">
        <div class="form-group">
          <label class="form-label" for="review-rating">Overall Rating</label>
          <select id="review-rating" class="form-control" required style="font-size: 1.05rem;">
            <option value="5">★★★★★ — 5 Stars (Exceptional)</option>
            <option value="4">★★★★☆ — 4 Stars (Very Good)</option>
            <option value="3">★★★☆☆ — 3 Stars (Average)</option>
            <option value="2">★★☆☆☆ — 2 Stars (Below Expectations)</option>
            <option value="1">★☆☆☆☆ — 1 Star (Poor)</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="review-text">Written Feedback</label>
          <textarea id="review-text" class="form-control" placeholder="Share your experience..." rows="4"></textarea>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">
          Submit Review
        </button>
      </form>
    </div>
  </div>

  <!-- Dynamic Footer -->
  <footer id="main-footer"></footer>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/patient-dashboard.js"></script>
</body>
</html>
